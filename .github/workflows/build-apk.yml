name: Build Android APK

# 触发：推送到 main/master 分支，或手动在 Actions 页面点 Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 云端自动装 Android cmdline-tools 并设置 ANDROID_HOME
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受许可并安装 SDK 包（云端有网，本机被墙不影响）
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools"

      - name: 安装 npm 依赖
        run: npm install

      - name: 构建前端 web 包
        run: npm run build

      - name: Capacitor 生成并同步安卓工程
        run: npx cap add android && npx cap sync android

      # 真因捕获：gradle 失败时本步骤自己把日志建 Issue（公开仓库第三方可未登录读），再 exit 1
      - name: 构建 debug APK（失败时自建诊断 Issue）
        id: gradle
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          if ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/gradle.log"; then
            echo "::notice::✅ gradle assembleDebug 成功"
          else
            echo "::error::❌ gradle 构建失败"
            {
              echo "## Gradle 构建失败（run #${{ github.run_number }}）"
              echo ""
              echo "### 末尾 250 行日志："
              echo '```'
              tail -n 250 "$GITHUB_WORKSPACE/gradle.log" 2>/dev/null || echo "(no log)"
              echo '```'
              echo ""
              echo "### android/app/build/outputs/apk/debug 目录状态："
              echo '```'
              ls -la android/app/build/outputs/apk/debug/ 2>&1 || echo "(no dir)"
              echo '```'
              echo ""
              echo "### gradle wrapper 版本："
              echo '```'
              cat gradle/wrapper/gradle-wrapper.properties 2>&1 || echo "(no wrapper file)"
              echo '```'
            } > /tmp/err.md
            gh issue create --title "Android build failed #${{ github.run_number }}" --body-file /tmp/err.md || true
            exit 1
          fi
        env:
          GRADLE_OPTS: "-Xmx2048m"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          GH_TOKEN: ${{ github.token }}

      # 防御性校验：APK 必须存在
      - name: 校验 APK 存在
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK 未生成"
            ls -la android/app/build/outputs/ 2>&1
            find android/app/build -name "*.apk" 2>/dev/null | head
            exit 1
          fi
          echo "::notice::✅ APK: $(du -h $APK | cut -f1)"

      # 找不到文件必须 error，不准沉默 warn
      - name: 上传 APK 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wardrobe-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
