name: Build Android APK

# 触发：推送到 main/master 分支，或手动在 Actions 页面点 Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Capacitor 7 的 @capacitor/android 要求 Java 21 编译（sourceCompatibility VERSION_21），必须用 JDK 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 云端自动装 Android cmdline-tools 并设置 ANDROID_HOME
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受基础许可 + 安装通用包
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" || true

      - name: 安装 npm 依赖
        run: npm install

      - name: 构建前端 web 包
        run: npm run build

      - name: Capacitor 生成并同步安卓工程
        run: npx cap add android && npx cap sync android

      # 修正包名：Capacitor 7 的 cap add/sync 不会把 capacitor.config.json 的 appId 写进 app/build.gradle，需手动同步
      - name: 修正 Android 包名为配置的 appId
        run: |
          APP_ID=$(node -e "console.log(require('./capacitor.config.json').appId)")
          echo "target appId = $APP_ID"
          sed -i "s/namespace = \"com.getcapacitor.myapp\"/namespace = \"$APP_ID\"/" android/app/build.gradle
          sed -i "s/applicationId \"com.getcapacitor.app\"/applicationId \"$APP_ID\"/" android/app/build.gradle
          grep -E "namespace|applicationId" android/app/build.gradle

      # 关键：根据生成的 android/variables.gradle 的 compileSdkVersion 动态装对应 platform（避免硬编码漏装）
      - name: 安装与 compileSdk 匹配的 Android 平台
        run: |
          yes | sdkmanager --licenses || true
          SDK_VER=$(grep -oE 'compileSdkVersion\s*=\s*[0-9]+' android/variables.gradle | grep -oE '[0-9]+' | head -1)
          echo "detected compileSdkVersion = $SDK_VER"
          sdkmanager "platforms;android-${SDK_VER}" "build-tools;${SDK_VER}.0.0" || true
          # 兜底：常见版本也装上，防止 build-tools 版本不匹配
          sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" || true

      # 真因捕获：gradle 失败时本步骤自己把日志建 Issue（公开仓库第三方可未登录读），再 exit 1
      - name: 构建 debug APK（失败时自建诊断 Issue）
        id: gradle
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          if ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/gradle.log"; then
            echo "::notice::✅ gradle assembleDebug 成功"
          else
            echo "::error::❌ gradle 构建失败"
            {
              echo "## Gradle 构建失败（run #${{ github.run_number }}）"
              echo ""
              echo "### 末尾 250 行日志："
              echo '```'
              tail -n 250 "$GITHUB_WORKSPACE/gradle.log" 2>/dev/null || echo "(no log)"
              echo '```'
              echo ""
              echo "### android/app/build/outputs/apk/debug 目录状态："
              echo '```'
              ls -la android/app/build/outputs/apk/debug/ 2>&1 || echo "(no dir)"
              echo '```'
              echo ""
              echo "### 已安装 SDK platforms："
              echo '```'
              sdkmanager --list 2>/dev/null | grep -E 'platforms|build-tools' | head -20 || echo "(list failed)"
              echo '```'
            } > /tmp/err.md
            gh issue create --title "Android build failed #${{ github.run_number }}" --body-file /tmp/err.md || true
            exit 1
          fi
        env:
          GRADLE_OPTS: "-Xmx2048m"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          GH_TOKEN: ${{ github.token }}

      # 防御性校验：APK 必须存在
      - name: 校验 APK 存在
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK 未生成"
            ls -la android/app/build/outputs/ 2>&1
            find android/app/build -name "*.apk" 2>/dev/null | head
            exit 1
          fi
          echo "::notice::✅ APK: $(du -h $APK | cut -f1)"

      # 找不到文件必须 error，不准沉默 warn
      - name: 上传 APK 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wardrobe-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
